<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRUEAILAB Assistant</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="app-wrapper">
        <aside class="sidebar">
            <div class="brand">
                <div class="logo">
                    <i class="fa-solid fa-layer-group"></i>
                </div>
                <h2>TRUEAI</h2>
            </div>
            
            <button id="new-chat-btn" class="new-chat-btn">
                <i class="fa-solid fa-plus"></i> New Conversation
            </button>
            
            <div class="sidebar-menu">
                <div class="menu-item active" id="menu-current-chat">
                    <i class="fa-regular fa-message"></i>
                    <span>Current Chat</span>
                </div>
                <div class="menu-item" id="menu-settings">
                    <i class="fa-solid fa-gear"></i>
                    <span>Settings</span>
                </div>
            </div>
            
            <div class="recent-chats-container" style="margin-top: 24px; flex: 1; overflow-y: auto;">
                <h3 style="font-size: 0.8rem; text-transform: uppercase; color: var(--text-muted); margin-bottom: 12px; padding: 0 12px; font-weight: 600;">Recent History</h3>
                <div id="recent-chat-list" style="display: flex; flex-direction: column; gap: 4px;">
                    <!-- Chat items dynamically populated here -->
                </div>
            </div>
            
            <div class="user-profile">
                <div class="avatar">
                    <i class="fa-solid fa-user"></i>
                </div>
                <div class="user-info">
                    <span class="user-name">Guest User</span>
                    <span class="user-status">Online</span>
                </div>
            </div>
        </aside>

        <main class="chat-container">
            <header class="chat-header">
                <div class="header-info">
                    <h2 id="chat-title-header">Knowledge Base Assistant</h2>
                    <p>Powered by RAG & Gemini</p>
                </div>
                <div class="header-actions">
                    <button class="icon-btn" id="clear-chat-btn" title="Clear Chat"><i class="fa-solid fa-trash-can"></i></button>
                    <button class="icon-btn" id="export-chat-btn" title="Export Chat"><i class="fa-solid fa-download"></i></button>
                </div>
            </header>
            
            <div id="chat-display" class="chat-display">
                <!-- Messages populated via JS -->
            </div>
            
            <footer class="chat-input-area">
                <form id="chat-form">
                    <div class="input-wrapper">
                        <input type="file" id="file-upload" style="display: none;">
                        <button type="button" id="attachment-btn" class="attachment-btn" title="Attach file">
                            <i class="fa-solid fa-paperclip"></i>
                        </button>
                        <input type="text" id="message-input" placeholder="Ask anything about the documentation..." autocomplete="off" required>
                        <button type="submit" id="send-btn" title="Send message">
                            <i class="fa-solid fa-paper-plane"></i>
                        </button>
                    </div>
                </form>
                <div class="footer-note">
                    AI can make mistakes. Consider verifying important information.
                </div>
            </footer>
        </main>
    </div>
    
    <!-- Toast Notifications Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Loading Template (Hidden) -->
    <template id="loading-template">
        <div class="message assistant-message loading-msg">
            <div class="message-avatar">
                <i class="fa-solid fa-robot"></i>
            </div>
            <div class="message-wrapper">
                <div class="typing-indicator">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </div>
    </template>

    <script src="app.js"></script>
</body>
</html>
