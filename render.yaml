services:
  - type: web
    name: trueailab-assistant
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: GEMINI_API_KEY
        sync: false
      - key: SIMILARITY_THRESHOLD
        value: 0.3
      - key: TOP_K
        value: 3
